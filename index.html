<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Varun Wallajabad</title>
    <link rel="stylesheet" type='text/css' href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

</head>
<body>

    <div class="terminal-window">
        <div class="terminal-header">
            <div class="mac-buttons">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
            </div>
            <span class="header-title">varun — vwallajabad.dev — zsh</span>
        </div>
        
        <div id="terminal-body">
            <div class="output-line system-msg">>> SYSTEM BOOT COMPLETE.</div>
            <div class="output-line" id="welcome-msg">Initializing local environment...</div>
        </div>

        <div class="input-area">
            <span class="prompt">❯</span>
            <div class="input-wrapper">
                <input type="text" id="cmd-input" spellcheck="false" autocomplete="off" autofocus>
                <div id="autocomplete-ghost"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
