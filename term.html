<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Varun Wallajabad | VW.OS</title>
    <link rel="stylesheet" type='text/css' href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-orange: #FF5F05;
            --accent-blue: #00f2ff;
            --bg-color: #050c16;
            --glass: rgba(16, 22, 35, 0.95);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #e3e8ef;
            --text-dim: #64748b;
            --mac-red: #ff5f56;
            --mac-yellow: #ffbd2e;
            --mac-green: #27c93f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255, 95, 5, 0.05) 0%, transparent 50%),
                linear-gradient(rgba(0, 242, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 20px;
        }

        .terminal-window {
            width: 100%;
            max-width: 1000px;
            height: 85vh;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 50px 100px rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            position: relative;
        }

        .terminal-header {
            background: rgba(255,255,255,0.03);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .mac-buttons {
            display: flex;
            gap: 8px;
            z-index: 2;
        }

        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .red { background: var(--mac-red); }
        .yellow { background: var(--mac-yellow); }
        .green { background: var(--mac-green); }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        #terminal-body {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.6;
            scroll-behavior: smooth;
        }

        .output-line { margin-bottom: 12px; animation: fadeIn 0.15s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .command-entered { color: var(--accent-blue); font-weight: 700; }
        .system-msg { color: var(--primary-orange); }

        /* Input Area */
        .input-area {
            display: flex;
            align-items: center;
            padding: 20px 30px;
            background: rgba(0,0,0,0.3);
            border-top: 1px solid var(--border);
            position: relative;
        }

        .prompt { color: var(--primary-orange); font-weight: 800; margin-right: 12px; z-index: 2; }

        .input-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
        }

        #cmd-input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: inherit;
            font-size: 14px;
            width: 100%;
            outline: none;
            z-index: 2;
            caret-color: var(--primary-orange);
        }

        #autocomplete-ghost {
            position: absolute;
            left: 0;
            top: 0;
            color: var(--text-dim);
            opacity: 0.5;
            pointer-events: none;
            z-index: 1;
            font-size: 14px;
            white-space: pre;
        }

        /* Content Styles */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin: 15px 0;
        }

        .card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
        }

        .card-title { color: var(--primary-orange); font-weight: 700; margin-bottom: 8px; }

        .hint-container {
            margin-top: 20px;
            padding: 10px;
            border-top: 1px dashed var(--border);
            font-size: 12px;
            color: var(--text-dim);
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="terminal-window">
        <div class="terminal-header">
            <div class="mac-buttons">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
            </div>
            <span class="header-title">varun — vwallajabad.dev — zsh</span>
        </div>
        
        <div id="terminal-body">
            <div class="output-line system-msg">>> SYSTEM BOOT COMPLETE.</div>
            <div class="output-line" id="welcome-msg">Initializing local environment...</div>
        </div>

        <div class="input-area">
            <span class="prompt">❯</span>
            <div class="input-wrapper">
                <input type="text" id="cmd-input" spellcheck="false" autocomplete="off" autofocus>
                <div id="autocomplete-ghost"></div>
            </div>
        </div>
    </div>

<script>
    const terminalBody = document.getElementById('terminal-body');
    const cmdInput = document.getElementById('cmd-input');
    const ghost = document.getElementById('autocomplete-ghost');

    const COMMANDS = ['about', 'projects', 'skills', 'contact', 'clear', 'help', 'ls', 'whoami'];

    const DATA = {
        about: `
            <div style="color: var(--accent-blue); font-weight: bold; margin-bottom: 8px;">[ USER_PROFILE ]</div>
            <b>Varun Wallajabad</b><br>
            Computer Science @ UIUC<br><br>
            I am a systems engineer and security researcher building resilient software. 
            Currently focused on distributed systems and kernel-level sandboxing.
        `,
        whoami: `guest_user@vwallajabad.dev`,
        skills: `
            <div class="card-grid">
                <div class="card"><div class="card-title">Languages</div>C++, Python, Go, Java, Rust</div>
                <div class="card"><div class="card-title">Systems</div>eBPF, Linux Kernel, Docker, Kubernetes</div>
                <div class="card"><div class="card-title">Cloud</div>AWS, Terraform, Distributed Computing</div>
                <div class="card"><div class="card-title">Security</div>Byzantine Fault Tolerance, Cryptography</div>
            </div>
        `,
        projects: `
            <div class="card-grid">
                <div class="card">
                    <div class="card-title">eBPF Sandbox</div>
                    <p>Process isolation using LSM hooks and eBPF bytecode for real-time security.</p>
                </div>
                <div class="card">
                    <div class="card-title">Paxos Ledger</div>
                    <p>Fault-tolerant distributed database implementing custom consensus protocols.</p>
                </div>
                <div class="card">
                    <div class="card-title">VW.OS</div>
                    <p>A web-based terminal OS designed for technical portfolio display.</p>
                </div>
            </div>
        `,
        contact: `
            Email: <a href="mailto:varun@vwallajabad.dev" style="color: var(--accent-blue)">varun@vwallajabad.dev</a><br>
            GitHub: <a href="https://github.com/vwallajabad" target="_blank" style="color: var(--accent-blue)">vwallajabad</a><br>
            LinkedIn: <a href="https://linkedin.com/in/vwallajabad" target="_blank" style="color: var(--accent-blue)">vwallajabad</a>
        `,
        help: `Available commands: <span style="color: var(--primary-orange)">${COMMANDS.join(', ')}</span><br><br><i>Tip: Use Tab or Right Arrow to autocomplete.</i>`
    };

    function print(html, type = 'default') {
        const div = document.createElement('div');
        div.className = 'output-line';
        if (type === 'command') {
            div.classList.add('command-entered');
            div.innerHTML = `❯ ${html}`;
        } else if (type === 'system') {
            div.classList.add('system-msg');
            div.innerHTML = html;
        } else {
            div.innerHTML = html;
        }
        terminalBody.appendChild(div);
        terminalBody.scrollTop = terminalBody.scrollHeight;
    }

    function handleAutocomplete() {
        const val = cmdInput.value.toLowerCase();
        if (!val) {
            ghost.innerText = "";
            return;
        }

        const match = COMMANDS.find(c => c.startsWith(val));
        if (match) {
            // Only show the part that hasn't been typed yet
            ghost.innerText = val + match.slice(val.length);
        } else {
            ghost.innerText = "";
        }
    }

    function runCommand(cmd) {
        cmd = cmd.toLowerCase().trim();
        ghost.innerText = "";
        if (!cmd) return;
        
        print(cmd, 'command');

        setTimeout(() => {
            if (DATA[cmd]) {
                print(DATA[cmd]);
            } else if (cmd === 'ls') {
                print(COMMANDS.join('  '));
            } else if (cmd === 'clear') {
                terminalBody.innerHTML = '';
                print(">> Buffer cleared.", "system");
            } else {
                print(`ERR: '${cmd}' command not recognized. Type 'help' for options.`, 'system');
            }
        }, 50);
        
        cmdInput.value = '';
    }

    cmdInput.addEventListener('input', handleAutocomplete);

    cmdInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            runCommand(cmdInput.value);
        } else if (e.key === 'Tab' || e.key === 'ArrowRight') {
            if (ghost.innerText) {
                e.preventDefault();
                cmdInput.value = ghost.innerText;
                ghost.innerText = "";
            }
        }
    });

    // Handle clicks to focus
    document.addEventListener('click', () => cmdInput.focus());

    // Boot Up
    window.onload = () => {
        setTimeout(() => {
            document.getElementById('welcome-msg').innerHTML = "Welcome, explorer. I'm <b>Varun Wallajabad</b>.<br>Type <span style='color: var(--primary-orange)'>'help'</span> to see available modules.";
        }, 500);
    };
</script>

</body>
</html>
